<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro · O Homem-Deus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="acesso">

        <section class="acesso-lado-azul">
            <a href="index.html" class="logo">
                <span class="logo-icone">†</span>
                O HOMEM-DEUS
            </a>

            <p class="acesso-citacao">
                “E o Verbo se fez carne<br><em>e habitou entre nós.</em>”
                <span>JOÃO 1:14</span>
            </p>
        </section>

        <section class="acesso-formulario">
            <div class="caixa-formulario">

                <a href="index.html" class="voltar">← Voltar ao início</a>

                <p class="rotulo">Comece agora</p>
                <h1 class="titulo-secao">Criar sua <em>conta</em></h1>
                <p class="texto-secao">Cadastre-se para acompanhar a jornada e o seu resultado no quiz.</p>

                <div class="campo">
                    <label for="inputNome">Nome</label>
                    <input type="text" id="inputNome" placeholder="Como você quer ser chamado(a)?">
                </div>

                <div class="campo">
                    <label for="inputEmail">E-mail</label>
                    <input type="email" id="inputEmail" placeholder="seuemail@exemplo.com">
                </div>

                <div class="campo">
                    <label for="inputSenha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="inputSenha" placeholder="Mínimo de 6 caracteres">
                        <button type="button" class="botao-olho" onclick="mostrarSenha('inputSenha', this)">Mostrar</button>
                    </div>
                </div>

                <div class="campo">
                    <label for="inputConfirmacao">Confirmar senha</label>
                    <div class="campo-senha">
                        <input type="password" id="inputConfirmacao" placeholder="Repita a senha">
                        <button type="button" class="botao-olho" onclick="mostrarSenha('inputConfirmacao', this)">Mostrar</button>
                    </div>
                </div>

                <div class="mensagem" id="mensagem"></div>

                <button class="botao-principal" onclick="cadastrar()">Criar conta →</button>

                <p class="troca">Já tem conta? <a href="login.html">Entrar</a></p>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>
</body>

</html>
